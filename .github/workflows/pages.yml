name: Deploy GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  MODEL_RELEASE_TAG: connectome-u16-v2
  MODEL_ARCHIVE: flybrain-connectome-u16-v2.tar.gz
  MODEL_ARCHIVE_SHA256: fbbd7193b4eaffb0cd72378bdfe6e037f4ac56f4e63a1d007b7999edaa8461ca
  MODEL_PACKAGE_SHA256: 0f5baf90bf5bed5802931b289d551474524547872ceb3eff657e25d9d8e54a37
  VITE_BASE_PATH: /flybrain-game/

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Download versioned connectome model
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$MODEL_ARCHIVE" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$MODEL_RELEASE_TAG/$MODEL_ARCHIVE"
          echo "$MODEL_ARCHIVE_SHA256  $RUNNER_TEMP/$MODEL_ARCHIVE" | sha256sum --check --strict
          mkdir -p artifacts/connectome-packed-u16-v2
          tar -xzf "$RUNNER_TEMP/$MODEL_ARCHIVE" -C artifacts/connectome-packed-u16-v2

      - name: Verify unpacked connectome model
        run: node scripts/verify-connectome-package.mjs artifacts/connectome-packed-u16-v2 "$MODEL_PACKAGE_SHA256"

      - name: Prepare browser model
        run: npm run prepare:connectome-web

      - name: Build project site
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
