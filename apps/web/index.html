<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A tiny winged human tries to survive a giant fly's predictive swat."
    />
    <title>FlyBrain Swatter</title>
  </head>
  <body>
    <main>
      <section class="masthead" aria-labelledby="game-title">
        <p class="eyebrow">A browser game and connectome research project</p>
        <h1 id="game-title">FlyBrain Swatter</h1>
        <p class="subtitle">You got the wings. It got the hands.</p>
      </section>
      <section class="cabinet" aria-label="FlyBrain Swatter game">
        <div id="game"></div>
        <p id="connectome-status" class="controller-status" role="status" aria-live="polite">
          Full connectome (WebGPU): press 5 to load · 148 MiB local / about 71 MiB compressed
        </p>
        <div class="cabinet__footer">
          <span>Move: Mouse / Touch · Opponent: 1–5 · Debug: H · Export: E · Restart: R</span>
          <span>Gray-box build 0.2</span>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
